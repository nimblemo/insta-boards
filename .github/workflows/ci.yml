name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & smoke (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Resolve & sync dependencies
        run: uv sync --all-extras

      - name: Build sdist + wheel
        run: uv build

      - name: Smoke test every subcommand
        run: |
          uv run insta-boards --help
          uv run insta-boards sync --help
          uv run insta-boards list --help
          uv run insta-boards list boards --help
          uv run insta-boards list items --help
          uv run insta-boards download --help
